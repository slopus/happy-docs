# Builds every docs site in this repository and deploys them to GitHub Pages
# on every push to main. Each product's site lives in its own directory and is
# served under the same path, e.g. enterprise/ at /happy-docs/enterprise/.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: enterprise/package-lock.json
      - name: Build Happy Enterprise docs
        working-directory: enterprise
        run: |
          npm ci
          npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r enterprise/dist _site/enterprise
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
